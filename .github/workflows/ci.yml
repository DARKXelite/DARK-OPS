name: CI

on:
  push:
    branches: [main, "chore/**", "feature/**", "fix/**"]
  pull_request:

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-fund
      - name: Audit dependency tree
        run: npm audit --audit-level=high

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up Java for Firebase emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        id: install
        run: npm install --no-fund
      - name: Run unit and security regression tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test
      - name: Run Firestore Rules emulator suite
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx --yes firebase-tools@15.34.1 emulators:exec --only firestore --project demo-clover-greens-ops "npm run test:rules"
      - name: Build production assets
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
